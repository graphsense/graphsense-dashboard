<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/img/favicon-16x16.png">
    <link rel="manifest" href="/public/site.webmanifest" crossorigin="use-credentials">
    <link rel="stylesheet" type="text/css" href="/public/fontawesome/css/all.css"/>
    <link rel="stylesheet" type="text/css" href="/public/DateTimePicker.css"/>
    <link rel="stylesheet" type="text/css" href="/public/fonts/roboto/roboto.css"/>
    <link rel="stylesheet" type="text/css" href="/public/fonts/robotoMono/robotoMono.css"/>
    <title>Iknaio Analytics Platform</title>
    <style type="text/css">
        /* Inherit font for for form elements; https://stackoverflow.com/questions/26140050/why-is-font-family-not-inherited-in-button-tags-automatically#:~:text=Form%20elements%20don't%20inherit,to%20set%20these%20properties%20manually.&text=If%20you%20inspect%20your%20demo,from%20the%20browser%20style%20sheet. */
       input, select, textarea, button{font-family:inherit;}
       /* Until Elm renders its own color-scheme (main.js then drops the marker). */
       html[data-theme="dark"]{color-scheme:dark;}
    </style>
    <script>
      // Dark before the first paint, so a reload in dark mode does not flash
      // white. Same rule as Config.UserSettings.themeModeDecoder: an explicit
      // themeMode wins, the old lightMode=false means dark, anything else
      // follows the system.
      try {
        var mode = localStorage.getItem('themeMode')
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
          mode = localStorage.getItem('lightMode') === 'false' ? 'dark' : 'system'
        }
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
