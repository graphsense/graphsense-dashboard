name: Build the dashboard

on: 
  workflow_dispatch:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - run: npm ci
      - name: Cache the Elm packages
        # Without it every run downloads all Elm packages, and a DNS blip on the
        # package server fails the build (run 45418376094). Safe with the
        # patched packages: clone-repo re-clones any clone not at its pinned
        # commit, and the vite build fails on a bundle without the patch.
        # A partial hit only downloads what is missing.
        uses: actions/cache@v4
        with:
          path: elm_packages
          key: elm-packages-${{ runner.os }}-${{ hashFiles('elm.json.base', 'codegen/elm.json', 'openapi/elm.json', 'review/elm.json', 'Makefile', 'package-lock.json') }}
          restore-keys: elm-packages-${{ runner.os }}-
      - run: cp env.template .env
      - run: make build
      - run: make test
      - run: make lint

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - run: npm ci
      - name: Cache the Elm packages
        # Without it every run downloads all Elm packages, and a DNS blip on the
        # package server fails the build (run 45418376094). Safe with the
        # patched packages: clone-repo re-clones any clone not at its pinned
        # commit, and the vite build fails on a bundle without the patch.
        # A partial hit only downloads what is missing.
        uses: actions/cache@v4
        with:
          path: elm_packages
          key: elm-packages-${{ runner.os }}-${{ hashFiles('elm.json.base', 'codegen/elm.json', 'openapi/elm.json', 'review/elm.json', 'Makefile', 'package-lock.json') }}
          restore-keys: elm-packages-${{ runner.os }}-
      - run: cp env.template .env
      - run: make e2e-install
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
